services:
  # 1. Next.js Dashboard Web Service
  - type: web
    name: lumino-dashboard
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm --filter web run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumino-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumino-redis
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://lumino-dashboard.onrender.com # Replace with your actual Render custom domain when active
      - fromGroup: lumino-shared-secrets

  # 2. Ingestion API and WebSocket Gateway
  - type: web
    name: lumino-gateway
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm --filter web run ws:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumino-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumino-redis
          property: connectionString
      - key: GATEWAY_PORT
        value: 3001
      - key: PORT
        value: 3001
      - fromGroup: lumino-shared-secrets

  # 3. Background Event Processor (Worker)
  - type: worker
    name: lumino-worker
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm --filter worker run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumino-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lumino-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: 10

  # 4. Redis Service
  - type: redis
    name: lumino-redis
    plan: free
    ipAllowList: [] # Allows access from all services running inside Render

databases:
  # 5. PostgreSQL Database
  - name: lumino-db
    databaseName: lumino
    plan: free

envVarGroups:
  - name: lumino-shared-secrets
    envVars:
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
