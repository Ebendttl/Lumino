version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lumino-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lumino
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lumino-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: lumino-worker
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/lumino?sslmode=disable
      - REDIS_URL=redis://redis:6379
    volumes:
      - maxmind_data:/usr/share/GeoIP

volumes:
  postgres_data:
  redis_data:
  maxmind_data:
